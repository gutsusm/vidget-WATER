<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #191919;
  --card: #202020;
  --surface: #292929;
  --surface-2: #242424;
  --border: #363636;

  --text: #f2f2f2;
  --muted: #929292;

  --accent: #4fa66a;
  --accent-hover: #5db878;
  --accent-dark: #397d50;
  --accent-soft: #263d2d;

  --glass: #292929;
  --glass-border: #353535;
}

html,
body {
  width: 100%;
  min-width: 0;
  min-height: 0;
  background: var(--bg);
}

body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--text);
  padding: clamp(4px, 2.5vw, 18px);
  overflow-x: hidden;
}

button,
input {
  font-family: inherit;
}

/* =========================
   WIDGET
========================= */

.widget {
  position: relative;

  width: 100%;
  max-width: 470px;

  /* ВАЖНО: никакой фиксированной высоты */
  min-height: 0;

  margin: 0 auto;

  background: var(--card);
  border: 1px solid var(--border);

  border-radius: clamp(10px, 4vw, 20px);

  padding: clamp(9px, 5vw, 24px);

  overflow: hidden;
}

.status-dot {
  position: absolute;

  top: clamp(6px, 2.5vw, 12px);
  right: clamp(7px, 2.7vw, 13px);

  width: clamp(5px, 2vw, 10px);
  aspect-ratio: 1;

  border-radius: 50%;

  background: var(--accent);

  box-shadow: 0 0 8px rgba(79, 166, 106, .65);
}

/* =========================
   NAV
========================= */

.nav {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));

  width: 88%;
  max-width: 365px;

  margin: 0 auto clamp(12px, 6vw, 30px);

  padding: clamp(2px, 1.2vw, 6px);

  background: var(--surface-2);

  border-radius: clamp(5px, 1.8vw, 8px);
}

.nav-button {
  min-width: 0;

  border: none;
  background: transparent;

  color: var(--muted);

  padding:
    clamp(6px, 2.5vw, 12px)
    clamp(2px, 1.5vw, 8px);

  border-radius: 7px;

  font-size: clamp(10px, 4vw, 18px);

  cursor: pointer;

  display: flex;
  justify-content: center;
  align-items: center;

  gap: clamp(3px, 1.7vw, 9px);

  transition: .2s ease;
}

.nav-button:hover {
  color: var(--text);
}

.nav-button.active {
  background: var(--accent);
  color: white;
}

.nav-icon {
  width: clamp(10px, 3.8vw, 18px);
  height: clamp(10px, 3.8vw, 18px);

  flex-shrink: 0;

  stroke: currentColor;
  fill: none;

  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* =========================
   VIEWS
========================= */

.view {
  display: none;
}

.view.active {
  display: block;
}

/* =========================
   CARD
========================= */

.glasses {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));

  gap: clamp(4px, 3vw, 16px);

  margin-top: clamp(7px, 3.5vw, 18px);
}

.glass {
  position: relative;

  width: 100%;

  /* Высота теперь зависит от ширины стакана */
  aspect-ratio: 0.62 / 1;

  overflow: hidden;

  background: var(--glass);

  border: 1px solid var(--glass-border);

  clip-path: polygon(
    7% 0,
    93% 0,
    84% 100%,
    16% 100%
  );
}

.water {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  height: 0%;

  background: var(--accent);

  transition: height .4s ease;
}

.water::before {
  content: "";

  position: absolute;

  width: 130%;
  height: 15%;

  top: -7%;
  left: -15%;

  border-radius: 45% 55% 50% 45%;

  background: var(--accent);
}

.daily-area {
  margin-top: clamp(15px, 10vw, 53px);

  display: flex;
  justify-content: space-between;
  align-items: flex-end;

  gap: 10px;

  padding:
    0
    clamp(3px, 2vw, 10px)
    clamp(2px, 1vw, 4px);
}

.daily-label {
  color: var(--accent);

  font-weight: 700;

  font-size: clamp(11px, 4.5vw, 21px);

  margin-bottom: clamp(5px, 3vw, 15px);
}

.daily-value {
  font-size: clamp(23px, 10vw, 46px);

  font-weight: 500;

  line-height: 1;

  color: var(--text);

  white-space: nowrap;
}

.add-button {
  width: clamp(38px, 16vw, 74px);

  aspect-ratio: 1;

  flex-shrink: 0;

  border-radius: 50%;

  border: 1px solid var(--border);

  background: var(--surface);

  color: var(--accent);

  font-size: clamp(25px, 10vw, 47px);
  font-weight: 200;

  cursor: pointer;

  display: flex;
  justify-content: center;
  align-items: center;

  line-height: 1;

  transition:
    background .2s ease,
    transform .15s ease;
}

.add-button:hover {
  background: #303030;
}

.add-button:active {
  transform: scale(.94);
}

/* =========================
   TABLE
========================= */

.date-row {
  display: flex;
  justify-content: space-between;
  align-items: center;

  gap: 8px;

  margin-bottom: clamp(10px, 5vw, 24px);
}

.date-title {
  min-width: 0;

  font-size: clamp(12px, 4.7vw, 22px);
  font-weight: 600;

  color: var(--text);
}

.date-controls {
  display: flex;

  gap: clamp(5px, 3vw, 14px);

  flex-shrink: 0;
}

.arrow-button {
  background: none;
  border: none;

  color: var(--accent);

  font-size: clamp(19px, 6vw, 27px);

  cursor: pointer;

  padding: 2px;
}

.total-box {
  background: var(--surface);

  border-radius: 7px;

  padding: clamp(8px, 3.5vw, 16px);

  font-size: clamp(11px, 4vw, 19px);

  color: var(--accent);

  margin-bottom: clamp(8px, 4vw, 20px);
}

.history-table {
  width: 100%;

  border-collapse: collapse;

  table-layout: fixed;
}

.history-table th {
  color: var(--accent);

  font-size: clamp(8px, 3.1vw, 15px);
  font-weight: 700;

  padding:
    clamp(5px, 2vw, 10px)
    1px
    clamp(6px, 2.5vw, 13px);

  text-align: center;

  overflow: hidden;
}

.history-table td {
  color: var(--muted);

  font-size: clamp(8px, 3.1vw, 15px);

  padding:
    clamp(7px, 3vw, 14px)
    1px;

  text-align: center;

  border-top: 1px solid var(--border);

  overflow: hidden;
}

.history-table td.cumulative {
  color: var(--text);
  font-weight: 600;
}

.delete-button {
  border: none;
  background: none;

  color: var(--accent);

  cursor: pointer;

  font-size: clamp(12px, 4vw, 19px);
}

.empty-message {
  text-align: center;

  color: var(--muted);

  padding: clamp(15px, 7vw, 35px) 0;

  font-size: clamp(10px, 3.2vw, 15px);
}

/* =========================
   GRAPH
========================= */

.graph-title {
  font-size: clamp(13px, 5vw, 23px);

  font-weight: 600;

  margin-bottom: clamp(12px, 6vw, 30px);
}

.chart {
  /*
    Высота графика теперь зависит от ширины виджета.
  */
  height: clamp(130px, 52vw, 245px);

  display: grid;

  grid-template-columns: repeat(7, minmax(0, 1fr));

  gap: clamp(3px, 2.5vw, 13px);

  align-items: end;
}

.chart-day {
  height: 100%;

  min-width: 0;

  display: flex;
  flex-direction: column;

  justify-content: flex-end;
  align-items: center;
}

.bar-container {
  width: 100%;
  max-width: 44px;

  flex: 1;

  min-height: 60px;

  background: var(--surface);

  border-radius: clamp(3px, 1.5vw, 7px);

  position: relative;

  overflow: hidden;
}

.bar-fill {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  height: 0%;

  background: var(--accent);

  border-radius: inherit;

  transition: height .5s ease;
}

.day-name {
  margin-top: clamp(7px, 3.5vw, 17px);

  color: var(--accent);

  font-size: clamp(8px, 2.8vw, 13px);

  font-weight: 600;
}

.day-value {
  color: var(--muted);

  font-size: clamp(7px, 2.5vw, 12px);

  margin-top: clamp(2px, 1.2vw, 6px);

  white-space: nowrap;
}

/* =========================
   MODAL
========================= */

.modal-overlay {
  position: fixed;

  inset: 0;

  background: rgba(0, 0, 0, .55);

  display: none;

  justify-content: center;
  align-items: center;

  padding: 12px;

  z-index: 100;
}

.modal-overlay.open {
  display: flex;
}

.modal {
  width: min(330px, 94vw);

  background: #242424;

  border: 1px solid var(--border);

  border-radius: 16px;

  padding: clamp(14px, 5vw, 23px);
}

.modal h3 {
  font-size: clamp(16px, 5vw, 20px);

  margin-bottom: 18px;
}

.quick-buttons {
  display: grid;

  grid-template-columns: repeat(3, minmax(0, 1fr));

  gap: 8px;

  margin-bottom: 13px;
}

.quick {
  border: 1px solid var(--border);

  background: var(--surface);

  color: var(--text);

  padding: 10px 3px;

  border-radius: 7px;

  font-size: clamp(10px, 3.5vw, 14px);

  cursor: pointer;
}

.quick:hover {
  border-color: var(--accent);
}

.amount-input {
  width: 100%;

  background: #191919;

  border: 1px solid var(--border);

  outline: none;

  color: var(--text);

  font-size: 16px;

  padding: 12px;

  border-radius: 7px;

  margin-bottom: 13px;
}

.amount-input:focus {
  border-color: var(--accent);
}

.modal-actions {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 9px;
}

.modal-btn {
  border: none;

  border-radius: 7px;

  padding: 11px;

  font-size: 14px;

  cursor: pointer;
}

.cancel {
  background: var(--surface);
  color: var(--muted);
}

.confirm {
  background: var(--accent);
  color: white;
}

/* =========================
   EXTRA SMALL NOTION BLOCK
========================= */

@media (max-width: 280px) {

  body {
    padding: 3px;
  }

  .widget {
    padding: 8px;
  }

  .nav {
    width: 94%;
  }

  .nav-button {
    font-size: 9px;
    gap: 2px;
  }

  .glasses {
    gap: 3px;
  }

  .daily-area {
    margin-top: 13px;
  }
}

@media (max-width: 210px) {

  .nav-button {
    font-size: 0;
  }

  .nav-icon {
    width: 14px;
    height: 14px;
  }

  .daily-label {
    font-size: 9px;
  }

  .daily-value {
    font-size: 20px;
  }

  .day-value {
    font-size: 6px;
  }
}
</style>
